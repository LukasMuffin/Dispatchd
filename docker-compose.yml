services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: dispatchd
      POSTGRES_PASSWORD: dispatchd
      POSTGRES_DB: dispatchd
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dispatchd -d dispatchd"]
      interval: 2s
      timeout: 5s
      retries: 15

  api:
    build: .
    command: ["uvicorn", "dispatchd.api.app:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      DISPATCHD_DATABASE_URL: postgresql://dispatchd:dispatchd@postgres:5432/dispatchd
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  worker:
    build: .
    command: ["dispatchd-worker"]
    environment:
      DISPATCHD_DATABASE_URL: postgresql://dispatchd:dispatchd@postgres:5432/dispatchd
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
